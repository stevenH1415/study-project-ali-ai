server:
  port: 18081

spring:
  application:
    name: mm-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 业务 / 认证后端
            - id: mm-backend
              uri: http://localhost:18083
              predicates:
                - Path=/api/auth/**
            # AI 聊天服务（含 SSE 流式）
            - id: mm-aichatboot
              uri: http://localhost:18082
              predicates:
                - Path=/api/chat/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "*"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
    nacos:
      discovery:
        enabled: false
        server-addr: 127.0.0.1:8848
    service-registry:
      auto-registration:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
